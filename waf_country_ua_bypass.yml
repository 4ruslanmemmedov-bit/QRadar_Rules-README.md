title: WAF Allowed Request From Geo-Blocked Country
id: 7a1c2e10-0a1a-4e1a-9b1a-bb2222220002
status: experimental
description: Detects a request from a country that the WAF policy blocks (e.g. Armenia, bend 10, Account 3) that was nevertheless allowed, indicating a bypass of the geo rule. Field names (country_code, action) are assumed.
author: Ruslan Mammadov - BlueTeam Account 2 (SOC)
date: 2026/10/17
references:
    - https://attack.mitre.org/techniques/T1090/
logsource:
    category: waf
    product: sucuri
detection:
    selection:
        action: 'allowed'
        country_code: 'AM'
    condition: selection
falsepositives:
    - Temporary exception to the geo rule approved by the team
level: high
tags:
    - attack.defense-evasion
    - attack.t1090
